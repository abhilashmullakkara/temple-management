<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Temple Management</h1>
    
    <!-- Today's Summary -->

<div class="today-summary">

    <div class="today-summary-title">
        TODAY
    </div>

    <div class="today-summary-row income">
        <span>Income</span>
        <strong id="todayIncome">₹0.00</strong>
    </div>

    <div class="today-summary-row expense">
        <span>Expense</span>
        <strong id="todayExpense">₹0.00</strong>
    </div>

</div>

    <div class="form-section">

        <div class="form-row">
            <label for="particulars">Particulars</label>

            <select id="particulars">
                <option value="">Select Pooja</option>
            </select>
        </div>


        <!-- Shown automatically for normal poojas -->
        <div class="form-row" id="standardAmountRow">
            <label>Amount</label>
            <span id="standardAmount">₹0.00</span>
        </div>


        <!-- Shown only when Others is selected -->
        <div class="form-row" id="otherParticularRow" style="display: none;">
            <label for="otherParticular">Specify Item</label>
            <input type="text" id="otherParticular">
        </div>


        <!-- Shown only when Others is selected -->
        <div class="form-row" id="otherAmountRow" style="display: none;">
            <label for="otherAmount">Amount</label>
            <input
                type="number"
                id="otherAmount"
                min="0"
                step="0.01"
                placeholder="Enter amount"
            >
        </div>


        <div class="form-row">
            <label for="devoteeName">Devotee Name</label>
            <input type="text" id="devoteeName">
        </div>


        <div class="form-row">
            <label for="address">Address</label>
            <textarea id="address" rows="3"></textarea>
        </div>


        <div class="form-row">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone">
        </div>


        <div class="buttons">
            <button id="saveButton">SAVE</button>
            <button id="clearButton" type="button">CLEAR</button>
        </div>

    </div>


    <div class="table-section">

        <div class="search-section">

            <label for="searchBox">Search:</label>

            <input
                type="text"
                id="searchBox"
                placeholder="Search name, phone, address or pooja..."
            >

        </div>


        <table>

            <thead>

                <tr>
                    <th>S.No</th>
                    <th>Particulars</th>
                    <th>Amount</th>
                    <th>Devotee Name</th>
                    <th>Address</th>
                    <th>Phone Number</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="recordsTable">
            </tbody>

        </table>

    </div>
   
   <!-- Expense Management -->

<div class="expense-management-section">

    <h2>Expenses</h2>

    <div class="expense-form">

        <div class="form-row">
            <label for="expenseDescription">
                Name / Description
            </label>

            <input
                type="text"
                id="expenseDescription"
                placeholder="e.g. Ashok (Secretary) - Ghee"
            >
        </div>


        <div class="form-row">
            <label for="expenseAmount">
                Amount
            </label>

            <input
                type="number"
                id="expenseAmount"
                min="0"
                step="0.01"
                placeholder="Enter amount"
            >
        </div>


        <div class="buttons">

            <button
                id="saveExpenseButton"
                type="button"
            >
                SAVE EXPENSE
            </button>

            <button
                id="clearExpenseButton"
                type="button"
            >
                CLEAR
            </button>

        </div>

    </div>


    <div class="expense-table-section">

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Name / Description</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="expensesTable">
            </tbody>

        </table>

    </div>

</div>


    <!-- Rate Management -->

    <div class="rate-management-section">

    <div class="rate-management-header">

        <label class="manage-rates-label">

            <input
                type="checkbox"
                id="manageRatesCheckbox"
            >

            <span>Manage Pooja Rates</span>

        </label>

        <button
            id="loadRatesButton"
            style="display: none;"
        >
            Refresh Rates
        </button>

    </div>


    <div
        id="ratesManagementContent"
        style="display: none;"
    >

        <table>

            <thead>

                <tr>
                    <th>Particular</th>
                    <th>Current Amount</th>
                    <th>New Amount</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="ratesTable">
            </tbody>

        </table>

    </div>

</div>

</div>

<script src="app.js?v=4"></script>


</body>
</html>
